<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Learning Forms </title>
</head>
<body>
    <h2> We're learning forms today </h2>
<form>
    <label for="Name"> Name:</label>
    <input type="text" name="Name" placeholder="Enter your name" id="Name">
    <br>
    <br>
    <label for="Age"> Age:</label>
    <input type="number" name="Age" placeholder="Enter your age" id="Age">
    <br>
    <br>
    <label for="City"> City:</label>
    <input type="text" name="City" placeholder="Enter your city" value="Delhi" id="City">
    <br>
    <br>
    <label for="Email"> Email:</label>
    <input type="email" name="Email" placeholder="Enter your email" id="Email">
    <br>
    <br>
    <label for="DOB"> Date of Birth:</label>
    <input type="date" name="DOB" placeholder="Enter your date of birth" id="DOB">
    <br>
    <br>
    <label for="Gender"> Gender:</label>
    <input type="radio" name="Gender" value="Male" id="Gender">
    <label for="Gender"> Male</label>
    <br>
    <br>
    <input type="color" name="color" value="color" id="Color">
    <label for="Color"> Color: </label>
    <br>
    <br>
    <input type="submit"> 
    <input type="reset">
</form>
</body>
</html>
