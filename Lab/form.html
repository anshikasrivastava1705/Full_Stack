<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Learning Forms </title>
</head>
<body>
    <h2> We're learning forms today </h2>
<form action="/register" method="post">
    <label for="Name"> Name:</label>
    <input type="text" name="Name" placeholder="Enter your name" id="Name" required minlength="2" maxlength="50">
    <br>
    <br>
    <label for="Age"> Age:</label>
    <input type="number" name="Age" placeholder="Enter your age" id="Age" min="1" max="100">
    <br>
    <br>
    <label for="City"> City:</label>
    <input type="text" name="City" placeholder="Enter your city" value="Delhi" id="City">
    <br>
    <br>
    <label for="Email"> Email:</label>
    <input type="email" name="Email" placeholder="Enter your email" id="Email" required maxlength="100">
    <br>
    <br>
    <label for="Password"> Password:</label>
    <input type="password" name="Password" placeholder="Enter your password" id="Password" required minlength="8" maxlength="20">
    <br>    
    <br>
    <label for="DOB"> Date of Birth:</label>
    <input type="date" name="DOB" placeholder="Enter your date of birth" id="DOB">
    <br>
    <br>
    <label for="Gender"> Gender:</label>
    <input type="radio" name="Gender" value="Male" id="Male">
    <label for="Male"> Male </label>
    <input type="radio" name="Gender" value="Female" id="Female"> 
    <label for="Female"> Female </label>
    <br>
    <br>
    <label for="Color"> Color: </label>
    <input type="color" name="color" value="color" id="Color">
    <br>
    <br>
    <input type="submit"> 
    <input type="reset">
</form>
</body>
</html>
